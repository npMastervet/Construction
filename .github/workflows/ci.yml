name: Construction checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-root-only
          MARIADB_DATABASE: construction_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/construction_test
      CONSTRUCTION_TEST_DATABASE_URL: mysql://test:test@127.0.0.1:3306/construction_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            Client/package-lock.json
            Server/package-lock.json
      - run: npm run install:all
      - run: npm run prisma:generate --prefix Server
      - run: npm run prisma:validate --prefix Server
      - run: npm run prisma:deploy --prefix Server
      - run: npm run check
