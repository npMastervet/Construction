<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Success">
  <!-- Result timing: icon completes at 1.5s, holds to 2s; ripple keeps looping. -->
  <g id="ripple">
    <animate attributeName="opacity" dur="2s" repeatCount="indefinite" calcMode="spline"
      values="1;1;0;0" keyTimes="0;0.5;0.9;1"
      keySplines="0 0 1 1;0.912 0.073 0.626 0.729;0 0 1 1"/>
    <g transform="translate(256 257.86)">
      <g>
        <animateTransform attributeName="transform" type="scale" dur="2s" repeatCount="indefinite" calcMode="spline" fill="freeze"
          values="1.5 1.5;1.5 1.5;2.1 2.1;2.1 2.1"
          keyTimes="0;0.15;0.85;1"
          keySplines="0 0 1 1;0.167 0 0.833 1;0 0 1 1"/>
        <ellipse cx="0" cy="-3" rx="118" ry="118" fill="var(--act-success-soft, #c8f1e0)" stroke="var(--act-card, #ffffff)" stroke-width="2"/>
      </g>
    </g>
  </g>
  <g id="circle">
    <g transform="translate(256 257.86)">
      <g>
        <animateTransform attributeName="transform" type="scale" dur="0.7s" calcMode="spline" fill="freeze"
          values="0 0;0 0;1.5 1.5;1.5 1.5"
          keyTimes="0;0.15;0.75;1"
          keySplines="0 0 1 1;0.656 0.872 0 0.98;0 0 1 1"/>
        <ellipse cx="0" cy="-3" rx="118" ry="118" fill="var(--act-success-fill, #2cda94)"/>
      </g>
    </g>
  </g>
  <g transform="translate(256 256)">
    <path id="check" fill="none" stroke="var(--act-check-stroke, #ffffff)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"
      pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
      d="M-82.5 4.5C-82.5 4.5 -31 55 -31 55C-31 55 73 -52.5 73 -52.5">
      <animate attributeName="stroke-dashoffset" dur="1.5s" fill="freeze"
        values="100;100;0;0" keyTimes="0;0.45;0.95;1"/>
    </path>
  </g>
</svg>
