<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Create">
  <!-- Loading/action loop: core stays visible while ripple and pencil motion continue. -->
  <g id="ripple">
    <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" calcMode="spline"
      values="0.75;0.75;0;0" keyTimes="0;0.35;0.9;1"
      keySplines="0 0 1 1;0.912 0.073 0.626 0.729;0 0 1 1"/>
    <g transform="translate(256 257.86)">
      <g>
        <animateTransform attributeName="transform" type="scale" dur="1.8s" repeatCount="indefinite" calcMode="spline" fill="freeze"
          values="1.5 1.5;1.5 1.5;2.1 2.1;2.1 2.1"
          keyTimes="0;0.1;0.85;1"
          keySplines="0 0 1 1;0.167 0 0.833 1;0 0 1 1"/>
        <ellipse cx="0" cy="-3" rx="118" ry="118" fill="var(--act-work-soft, #c8f1e0)" stroke="var(--act-card, #ffffff)" stroke-width="2"/>
      </g>
    </g>
  </g>
  <g id="circle">
    <g transform="translate(256 257.86)">
      <g>
        <animateTransform attributeName="transform" type="scale" dur="0.55s" calcMode="spline" fill="freeze"
          values="0 0;1.5 1.5;1.5 1.5"
          keyTimes="0;0.75;1"
          keySplines="0.656 0.872 0 0.98;0 0 1 1"/>
        <ellipse cx="0" cy="-3" rx="118" ry="118" fill="var(--act-work-fill, #2cda94)"/>
      </g>
    </g>
  </g>
  <g transform="translate(256 256)">
    <rect x="-46" y="-62" width="92" height="118" rx="12"
      fill="none" stroke="var(--act-icon-stroke, #ffffff)" stroke-width="8"
      pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" dur="0.9s" fill="freeze"
        values="100;100;0" keyTimes="0;0.35;1"/>
    </rect>
    <path fill="none" stroke="var(--act-icon-stroke, #ffffff)" stroke-width="7" stroke-linecap="round"
      pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
      d="M-28 -38 H28 M-28 -14 H16">
      <animate attributeName="stroke-dashoffset" dur="1s" fill="freeze"
        values="100;100;0" keyTimes="0;0.4;1"/>
    </path>
    <path fill="none" stroke="var(--act-icon-stroke, #ffffff)" stroke-width="8" stroke-linecap="round"
      pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" d="M-28 18 H32">
      <animate attributeName="stroke-dashoffset" dur="1.2s" fill="freeze"
        values="100;100;0" keyTimes="0;0.45;1"/>
    </path>
    <path fill="var(--act-icon-stroke, #ffffff)" stroke="none"
      d="M38 8 L58 -12 L68 -2 L48 18 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="0.8s" repeatCount="indefinite"
        values="-8 48 8; -2 48 8; -8 48 8" keyTimes="0;0.5;1"/>
      <rect x="44" y="14" width="10" height="5" rx="1" fill="var(--act-icon-stroke, #ffffff)" transform="rotate(-35 49 16.5)"/>
    </g>
  </g>
</svg>
